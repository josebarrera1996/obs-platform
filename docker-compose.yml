# ── ObsPlatform Docker Compose ──
# Start: docker compose up -d
# Stop:  docker compose down
#
# Profiles:
#   (default)  → app only
#   pipeline   → app + NATS JetStream
#   scheduler  → app + alert scheduler cron
#   ml         → app + PostgreSQL with pgvector
#   all        → everything

services:
  # ── PostgreSQL with pgvector for ML Feature Store ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obs_platform}
      POSTGRES_USER: ${POSTGRES_USER:-obs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obs_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obs_user} -d ${POSTGRES_DB:-obs_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-obs_platform}
      POSTGRES_USER: ${POSTGRES_USER:-obs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obs_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Alert Scheduler ──
  # Evaluates alert rules every 5 minutes
  scheduler:
    image: alpine/curl:latest
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - scheduler
      - all
    command: >
      sh -c "
        while true; do
          curl -s -X POST http://app:3000/api/alerts/schedule?credentialId=\$${SCHEDULER_CREDENTIAL_ID:-} 2>/dev/null || echo 'Scheduler tick failed';
          sleep 300;
        done
      "
    environment:
      - SCHEDULER_CREDENTIAL_ID=${SCHEDULER_CREDENTIAL_ID:-}

  # ── Automatic Backup ──
  # Creates a backup of credentials.json every hour
  backup:
    image: alpine/curl:latest
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - scheduler
      - all
    command: >
      sh -c "
        while true; do
          curl -s -X POST http://app:3000/api/backup -H 'Content-Type: application/json' -d '{\"action\":\"create\"}' 2>/dev/null || echo 'Backup tick failed';
          sleep 3600;
        done
      "

  # ── NATS JetStream for streaming telemetry ──
  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
    profiles:
      - pipeline
      - all

  # ── OpenTelemetry Collector ──
  # Receives telemetry from the app and forwards to NATS + Quickwit
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      - nats
      - quickwit
    restart: unless-stopped
    profiles:
      - pipeline
      - all

  # ── Quickwit (log/metric search engine) ──
  # Like Elasticsearch but lighter — stores and indexes telemetry data
  quickwit:
    image: quickwit/quickwit:latest
    command: ["run"]
    ports:
      - "7280:7280"  # REST API
      - "7281:7281"  # gRPC
    volumes:
      - ./quickwit-config.yml:/quickwit/config.yml
      - quickwit_data:/quickwit/data
    restart: unless-stopped
    profiles:
      - pipeline
      - all

  # ── External Health Monitor ──
  # Monitors the app from outside every 5 minutes
  monitor:
    image: alpine/curl:latest
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - scheduler
      - all
    command: >
      sh -c "
        while true; do
          echo '=== Health Check \$(date) ===';
          curl -s http://app:3000/api/external-health?format=text && echo '';
          sleep 300;
        done
      "

volumes:
  nats_data:
  quickwit_data:
  postgres_data: